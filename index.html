<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Tela de Login -->
        <section id="tela-login" class="tela ativa">
            <div class="login-esquerda">
                <h1>SGA</h1>
                <p>Sistema de Gestão Acadêmica - Área do Docente</p>
                <div class="login-destaque">
                    <p>Acompanhe turmas, lance notas e gere boletins em um só lugar.</p>
                </div>
            </div>
            <div class="login-direita">
                <div class="card card-formulario">
                    <h2>Bem-vindo de volta</h2>
                    <p class="subtitulo">Entre com suas credenciais institucionais</p>
                    <form id="form-login">
                        <div class="grupo-campo">
                            <label>E-mail institucional</label>
                            <input type="email" id="login-email" required placeholder="email@maisunifacisa.com.br">
                        </div>
                        <div class="grupo-campo">
                            <label>Senha</label>
                            <input type="password" id="login-senha" required>
                        </div>
                        <button type="submit" class="btn-principal">Entrar</button>
                    </form>
                    <div class="rodape-formulario">
                        <p>Ainda não tem uma conta?</p>
                        <a href="cadastro.html" id="link-cadastro">Cadastre-se como professor</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
