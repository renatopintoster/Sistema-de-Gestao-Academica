<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Tela de Login -->
        <section id="login-view" class="view active">
            <div class="login-left">
                <h1>SGA</h1>
                <p>Sistema de Gestão Acadêmica - Área do Docente</p>
                <div class="login-graphic">
                    <p>Acompanhe turmas, lance notas e gere boletins em um só lugar.</p>
                </div>
            </div>
            <div class="login-right">
                <div class="card form-card">
                    <h2>Bem-vindo ao SGA!</h2>
                    <p class="subtitle">Entre com suas credenciais institucionais</p>
                    <form id="login-form">
                        <div class="form-group">
                            <label>E-mail institucional</label>
                            <input type="email" id="login-email" required placeholder="email@maisunifacisa.com.br">
                        </div>
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="login-password">
                        </div>
                        <button type="submit" class="btn-primary">Entrar</button>
                    </form>
                    <div class="form-footer">
                        <p>Ainda não tem uma conta?</p>
                        <a href="cadastro.html" id="link-register">Cadastre-se como professor</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
