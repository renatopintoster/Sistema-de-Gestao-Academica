<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Tela de Cadastro -->
        <section id="tela-cadastro" class="tela ativa">
            <div class="login-esquerda">
                <h1>SGA</h1>
                <p>Sistema de Gestão Acadêmica - Área do Docente</p>
                <div class="login-destaque">
                    <p>Crie sua conta de professor para começar a lançar notas.</p>
                </div>
            </div>
            <div class="login-direita">
                <div class="card card-formulario">
                    <h2>Criar conta de professor</h2>
                    <p class="subtitulo">Preencha os dados abaixo para se cadastrar</p>
                    <form id="form-cadastro">
                        <div class="grupo-campo">
                            <label>Nome completo</label>
                            <input type="text" id="cad-nome" required placeholder="Ana Paula Menezes">
                        </div>
                        <div class="grupo-campo">
                            <label>E-mail institucional</label>
                            <input type="email" id="cad-email" required placeholder="professor@maisunifacisa.com.br">
                        </div>
                        <div class="grupo-campo">
                            <label>Senha</label>
                            <input type="password" id="cad-senha" required placeholder="********">
                        </div>
                        <div class="grupo-campo">
                            <label>Confirmar senha</label>
                            <input type="password" id="cad-confirmar-senha" required placeholder="********">
                        </div>
                        <button type="submit" class="btn-principal">Cadastrar</button>
                        <div class="rodape-formulario" style="margin-top:15px;">
                            <a href="index.html" id="link-login">Voltar para o login</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
