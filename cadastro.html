<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Tela de Cadastro -->
        <section id="register-view" class="view active">
            <div class="login-left">
                <h1>SGA</h1>
                <p>Sistema de Gestão Acadêmica - Área do Docente</p>
                <div class="login-graphic">
                    <p>Crie sua conta de professor para começar a lançar notas.</p>
                </div>
            </div>
            <div class="login-right">
                <div class="card form-card">
                    <h2>Criar conta de professor</h2>
                    <p class="subtitle">Preencha os dados abaixo para se cadastrar</p>
                    <form id="register-form">
                        <div class="form-group">
                            <label>Nome completo</label>
                            <input type="text" id="reg-name">
                        </div>
                        <div class="form-group">
                            <label>E-mail institucional</label>
                            <input type="email" id="reg-email">
                        </div>
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="reg-password">
                        </div>
                        <div class="form-group">
                            <label>Confirmar senha</label>
                            <input type="password" id="reg-confirm">
                        </div>
                        <button type="submit" class="btn-primary">Cadastrar</button>
                        <div class="form-footer" style="margin-top:15px;">
                            <a href="index.html" id="link-login">Voltar para o login</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
